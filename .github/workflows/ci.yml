# Unit tests (against real PostgreSQL 18) and the black-box integration suite (real server + real PostgreSQL 18 +
# headless Chromium, with fake AI and push services at the network edge). No secrets, no paid calls, no production.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      BB_PG_URL: postgres://postgres:ci-only-local-password@127.0.0.1:5432/postgres
      TEST_DATABASE_URL: postgres://postgres:ci-only-local-password@127.0.0.1:5432/unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (public registry, from the lockfile)
        run: npm ci
      - name: Install Chromium for the browser specs
        run: npx playwright install --with-deps chromium
      - name: Create the unit-test database
        run: psql "$BB_PG_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE unit'
      - name: Unit + black-box integration tests
        run: npm run test:all
      - name: Upload black-box report (failure only; synthetic fixtures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blackbox-report
          path: |
            playwright-report/
            test-results/bb/
          retention-days: 7
          if-no-files-found: ignore
